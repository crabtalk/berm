[package]
name = "berm-registry"
description = "An index of published harnesses, over the registries that hold them"
edition.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
keywords = ["oci", "registry", "index", "harness"]
categories = ["virtualization"]

[[bin]]
name = "berm-registry"
path = "bin/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
berm-api.workspace = true
berm-oci.workspace = true
clap.workspace = true
reqwest = { workspace = true, features = ["json", "rustls"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
