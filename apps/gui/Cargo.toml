[package]
name = "berm-gui"
description = "A workbench for programs — deploy one, read its tools, run them"
edition.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
# The app is not a library anyone depends on.
publish = false

[[bin]]
name = "berm-gui"
path = "bin/main.rs"

[dependencies]
anyhow.workspace = true
berm.workspace = true
berm-api.workspace = true
berm-index.workspace = true
berm-oci.workspace = true
bermd.workspace = true
bezel.workspace = true
# The facade re-exports gpui but not the platform, and `Application` builds only
# from one.
gpui_platform.workspace = true
serde_json.workspace = true
tokio.workspace = true
