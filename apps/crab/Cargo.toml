[package]
name = "crab-cli"
description = "Command-line client for bermd"
edition.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "crab"
path = "bin/main.rs"

[dependencies]
anyhow.workspace = true
berm-api.workspace = true
berm-index.workspace = true
berm-oci.workspace = true
chrono.workspace = true
clap.workspace = true
# `query`, so a search term with a space in it is encoded rather than pasted.
reqwest = { workspace = true, features = ["blocking", "json", "query"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
