[package]
name = "bermd"
description = "A long-running service that deploys harnesses and serves their tools over MCP"
edition.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
keywords = ["mcp", "sandbox", "riscv", "harness", "daemon"]
categories = ["virtualization"]

[[bin]]
name = "bermd"
path = "bin/main.rs"

[features]
default = ["jit"]
jit = ["berm/jit"]
aot = ["berm/aot"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
berm.workspace = true
berm-api.workspace = true
clap.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
