[package]
name = "bermd"
description = "A long-running service that deploys programs and serves their tools over MCP"
edition.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
keywords = ["mcp", "sandbox", "riscv", "program", "daemon"]
categories = ["virtualization"]

[[bin]]
name = "bermd"
path = "bin/main.rs"

[features]
# Passed through to berm, which is where the two backends live.
default = ["wasm"]
wasm = ["berm/wasm"]
riscv = ["berm/riscv"]
riscv-jit = ["berm/riscv-jit"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
berm.workspace = true
berm-api.workspace = true
clap.workspace = true
futures-util.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
