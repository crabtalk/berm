name: CI

on:
  # Only `main` on push. A branch with an open PR would otherwise run every
  # job twice, once for the push and once for the pull request.
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The matrix is the point of this job. rvtime had only ever run on
  # macOS/arm64, which left two things unverified: Linux, and x86_64 code
  # generation. The runners cover both at once — and the 4 KiB page size on
  # Linux exercises the segment-permission merging that 16 KiB pages hide.
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: macos-aarch64
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace
      - run: cargo nextest run --workspace --release

      # The object backend, which the default features leave out. Both runners
      # matter more here than elsewhere: the relocation a call compiles to and
      # the section names an artifact travels in are per-format, so Mach-O and
      # ELF reach different arms of the loader.
      #
      # With both backends the artifact is checked against the JIT; with only
      # the object backend the whole instruction-set suite runs through it.
      - run: cargo nextest run -p rvtime-compiler -p rvtime --features rvtime-compiler/aot,rvtime/aot -E 'binary(aot)'
      - run: cargo nextest run -p rvtime-compiler -p rvtime --no-default-features --features rvtime-compiler/aot,rvtime/aot

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo clippy -p rvtime-compiler -p rvtime --no-default-features --features rvtime-compiler/aot,rvtime/aot --all-targets

  # The examples are documentation: the book includes them by reference rather
  # than pasting them, so running them here is what keeps the docs honest.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest

      - name: run the examples
        run: |
          for example in calling_a_guest host_functions guest_heap interrupting; do
            echo "::group::$example"
            cargo run --quiet -p rvtime --example "$example"
            echo "::endgroup::"
          done

      - name: build the book
        run: mdbook build docs

  # The guest SDK and the fixtures sit outside the workspace, so nothing above
  # compiles them. Without this they rot silently until someone regenerates a
  # fixture.
  guest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv64imac-unknown-none-elf
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: build the guest SDK
        working-directory: rvtime/guest
        run: |
          cargo build --release --target riscv64imac-unknown-none-elf
          # Lib only: --all-targets would pull in the test harness, which a
          # no_std crate cannot link (no panic handler).
          cargo clippy --release --target riscv64imac-unknown-none-elf

      - name: build the fixtures against it
        run: |
          for dir in fixtures/*/; do
            [ -f "$dir/Cargo.toml" ] || continue
            echo "::group::$dir"
            (cd "$dir" && cargo build --release --target riscv64imac-unknown-none-elf)
            echo "::endgroup::"
          done

      # Proves what only a real build can: that the macro's exports survive
      # --gc-sections, that --emit-relocs reached the linker, and that the
      # manifest section is where the host looks for it.
      - name: build the reference guest
        run: cargo build --release -p berm-fixture --target riscv64imac-unknown-none-elf

      - name: run it under berm
        run: cargo run --release --example measure -p berm

      # A harness calling a harness, which only a real guest can show: the
      # call, a refusal, and a target that ran and said no.
      - name: nest one harness inside another
        run: cargo run --release --example nesting -p berm
