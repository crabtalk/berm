name: Deploy Site

# One build for the whole site: `bun run build` drives mdbook into `www/static`
# first, so what CI publishes is what `bun run dev` serves.
on:
  push:
    branches: [main]
    paths:
      - "www/**"
      - "docs/**"
      # The book includes the examples by reference, so they invalidate the
      # published site too.
      - "rvtime/rvtime/examples/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    # `ubuntu-latest` rather than the self-hosted `Linux` label the other repos
    # use, because it is not confirmed reachable here and an unresolvable label
    # queues forever instead of failing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "latest"

      - run: bun install --frozen-lockfile
        working-directory: www

      - run: bun run build
        working-directory: www
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www/build
