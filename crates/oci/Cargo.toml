[package]
name = "berm-oci"
description = "Publishing and fetching harnesses as OCI artifacts"
edition.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
keywords = ["oci", "registry", "harness", "sandbox"]
categories = ["virtualization"]

[dependencies]
anyhow.workspace = true
berm-api.workspace = true
# TLS, because a registry is the one thing here that is not loopback.
reqwest = { workspace = true, features = ["blocking", "json", "rustls"] }
serde_json.workspace = true
hex.workspace = true
sha2.workspace = true
