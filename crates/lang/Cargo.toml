[package]
name = "berm-lang"
description = "Guest-side library for building Crabtalk programs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["crabtalk", "program", "sandbox", "riscv"]
readme = "README.md"

[lib]
# No host tests yet: the crate is `no_std`, so a test harness would need one
# written against the stubs below.
test = false

[features]
# Installs an allocator that takes its heap from the host on first use.
default = ["alloc", "args"]
alloc = ["dep:linked_list_allocator"]
# Typed tool arguments. On by default because a tool that takes none is the
# exception; a program like `peers` can turn it off.
args = ["alloc", "dep:serde_guest", "dep:serde_json_guest"]

[dependencies]
berm-codegen.workspace = true
serde_guest = { workspace = true, optional = true }
serde_json_guest = { workspace = true, optional = true }

# The allocator is installed as *the* global allocator, which only a guest
# target may do — off one, this crate is a library inside someone's tests and
# std already has one.
[target.'cfg(target_arch = "wasm32")'.dependencies]
linked_list_allocator = { workspace = true, optional = true }

# `guest` supplies the `ecall` wrappers, which only this target has.
[target.'cfg(target_arch = "riscv64")'.dependencies]
guest.workspace = true
linked_list_allocator = { workspace = true, optional = true }
