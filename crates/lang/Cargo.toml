[package]
name = "berm-lang"
description = "Guest-side library for building Crabtalk programs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["crabtalk", "program", "sandbox", "wasm"]
readme = "README.md"

[lib]
# No host tests yet: the crate is `no_std`, so a test harness would need one
# written against the stubs below.
test = false

[dependencies]
berm-codegen.workspace = true
serde_guest.workspace = true
serde_json_guest.workspace = true

# The allocator is installed as *the* global allocator, which only a guest
# target may do — off one, this crate is a library inside someone's tests and
# std already has one. It takes its heap from the host on first use.
[target.'cfg(target_arch = "wasm32")'.dependencies]
linked_list_allocator.workspace = true
