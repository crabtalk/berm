[package]
name = "rvtime-guest"
description = "Guest-side support for programs running under rvtime"
edition.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["riscv", "no-std", "guest", "rvtime"]
categories = ["no-std", "embedded"]

# The crate builds anywhere, but only the guest target has the `ecall` these
# wrappers exist for. Documenting against it shows the real thing rather than
# the stubs a host build compiles.
[package.metadata.docs.rs]
targets = ["riscv64imac-unknown-none-elf"]

[features]
default = ["alloc"]
# Installs a global allocator. Turn off to supply your own.
alloc = ["dep:linked_list_allocator"]

[dependencies]
linked_list_allocator = { version = "0.10", optional = true }
