[package]
name = "berm"
description = "The operating system for agent harnesses — runs guest ELFs under rvtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["aot"]
jit = ["rvtime/jit"]
aot = ["rvtime/aot"]

[dependencies]
anyhow.workspace = true
berm-api.workspace = true
berm-codegen.workspace = true
hex.workspace = true
object.workspace = true
sha2.workspace = true
rvtime.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
tracing-subscriber = { workspace = true, features = ["env-filter"] }
