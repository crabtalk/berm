[package]
name = "berm"
description = "The operating system for agent harnesses — runs guest ELFs under rvtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Which backend compiles a program.
default = ["riscv"]
riscv = ["rvtime/aot"]
# rvtime's other backend, compiling into memory rather than an object file.
riscv-jit = ["rvtime/jit"]

[dependencies]
anyhow.workspace = true
berm-api.workspace = true
berm-codegen.workspace = true
hex.workspace = true
sha2.workspace = true
rvtime = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
tracing-subscriber = { workspace = true, features = ["env-filter"] }
