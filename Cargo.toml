[workspace]
members = ["apps/*", "crates/*", "rvtime/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.0.7"
repository = "https://github.com/crabtalk/berm"
license = "Apache-2.0"
authors = ["clearloop <tianyi.gc@gmail.com>"]
readme = "README.md"
keywords = ["riscv", "jit", "compiler", "cranelift", "sandbox"]
categories = ["compilers", "virtualization"]

[workspace.dependencies]
# Off by default down the chain from `compiler`, so that a build of bermd can
# pick a backend.
berm = { path = "crates/berm", version = "0.0.7", default-features = false }
berm-api = { path = "crates/api", version = "0.0.7" }
berm-codegen = { path = "crates/codegen", version = "0.0.7" }
berm-index = { path = "crates/index", version = "0.0.7" }
berm-lang = { path = "crates/lang", version = "0.0.7" }
berm-oci = { path = "crates/oci", version = "0.0.7" }
bermd = { path = "apps/service", version = "0.0.7" }
rv = { path = "rvtime/core", package = "rvtime-core", version = "0.0.7" }
translator = { path = "rvtime/cranelift", package = "rvtime-cranelift", version = "0.0.7" }
# Off by default: rvtime's own `jit` and `aot` features pick the backend, and a
# member cannot turn off default features it inherits.
compiler = { path = "rvtime/compiler", package = "rvtime-compiler", version = "0.0.7", default-features = false }
rvtime = { path = "rvtime/rvtime", package = "rvtime", version = "0.0.7", default-features = false }
# Off by default: berm-lang installs its own global allocator, and a guest can
# only have one.
guest = { path = "rvtime/guest", package = "rvtime-guest", version = "0.0.7", default-features = false }

# crates-io
anyhow = "1.0"
axum = "0.8"
bezel = "0.1"
cc = "1.4"
clap = { version = "4", features = ["derive"] }
cranelift = { version = "0.134.3", features = [
    "jit",
    "module",
    "native",
    "frontend",
] }
cranelift-codegen = { version = "0.134.3", features = ["incremental-cache"] }
cranelift-object = "0.134.3"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# bezel's own gpui, republished. A second copy is a second type universe,
# whose failure is a window that paints shapes but no text.
gpui = { package = "bezel-gpui", version = "0.3.3" }
gpui_platform = { package = "bezel-gpui-platform", version = "0.3.3", features = [
    "font-kit",
] }
libc = "0.2"
linked_list_allocator = "0.10"
object = { version = "0.40", features = ["wasm"] }
proc-macro2 = "1"
quote = "1"
reqwest = { version = "0.13", default-features = false }
rmcp = { version = "2.2", default-features = false, features = [
    "server",
    "transport-streamable-http-server",
] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The same crates for guests, which are `no_std` with an allocator. Second
# entries rather than features on the first because a member cannot turn off
# default features it inherits.
serde_guest = { package = "serde", version = "1", default-features = false, features = [
    "derive",
    "alloc",
] }
serde_json_guest = { package = "serde_json", version = "1", default-features = false, features = [
    "alloc",
] }
sha2 = "0.11"
syn = { version = "2", features = ["full"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "net",
    "signal",
    "sync",
    "time",
] }
# rustls to match what reqwest already pulls. A second TLS stack is a second
# set of root certificates, and the one that fails is whichever you did not
# configure.
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-native-roots",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Off by default down the chain, as `compiler` is: a build of bermd picks its
# backends, and `cache` drags in a config format nothing here reads.
wasmtime = { version = "48", default-features = false, features = [
    "anyhow",
    "cache",
    "cranelift",
    "parallel-compilation",
    "runtime",
    "std",
] }

[profile.dev]
# Enough for a backtrace to name a line. The full DWARF is what made `target`
# 12G, 8.6G of it `deps` (2026-08-27).
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0
