[workspace]
members = ["apps/*", "crates/*", "rvtime/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.0.5"
repository = "https://github.com/crabtalk/berm"
license = "Apache-2.0"
authors = ["clearloop <tianyi.gc@gmail.com>"]
readme = "README.md"
keywords = ["riscv", "jit", "compiler", "cranelift", "sandbox"]
categories = ["compilers", "virtualization"]

[workspace.dependencies]
# Off by default down the chain from `compiler`, so that a build of bermd can
# pick a backend.
berm = { path = "crates/berm", version = "0.0.5", default-features = false }
berm-api = { path = "crates/api", version = "0.0.5" }
berm-codegen = { path = "crates/codegen", version = "0.0.5" }
berm-index = { path = "crates/index", version = "0.0.5" }
berm-lang = { path = "crates/lang", version = "0.0.5" }
berm-oci = { path = "crates/oci", version = "0.0.5" }
bermd = { path = "apps/service", version = "0.0.5" }
rv = { path = "rvtime/core", package = "rvtime-core", version = "0.0.5" }
translator = { path = "rvtime/cranelift", package = "rvtime-cranelift", version = "0.0.5" }
# Off by default: rvtime's own `jit` and `aot` features pick the backend, and a
# member cannot turn off default features it inherits.
compiler = { path = "rvtime/compiler", package = "rvtime-compiler", version = "0.0.5", default-features = false }
rvtime = { path = "rvtime/rvtime", package = "rvtime", version = "0.0.5", default-features = false }
# Off by default: berm-lang installs its own global allocator, and a guest can
# only have one.
guest = { path = "rvtime/guest", package = "rvtime-guest", version = "0.0.5", default-features = false }

# crates-io
anyhow = "1.0"
axum = "0.8"
cc = "1.4"
clap = { version = "4", features = ["derive"] }
cranelift = { version = "0.134.3", features = [
    "jit",
    "module",
    "native",
    "frontend",
] }
cranelift-codegen = { version = "0.134.3", features = ["incremental-cache"] }
cranelift-object = "0.134.3"
libc = "0.2"
linked_list_allocator = "0.10"
object = "0.40"
proc-macro2 = "1"
quote = "1"
reqwest = { version = "0.13", default-features = false }
rmcp = { version = "2.2", default-features = false, features = [
    "server",
    "transport-streamable-http-server",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The same crates for guests, which are `no_std` with an allocator. Second
# entries rather than features on the first because a member cannot turn off
# default features it inherits.
serde_guest = { package = "serde", version = "1", default-features = false, features = [
    "derive",
    "alloc",
] }
serde_json_guest = { package = "serde_json", version = "1", default-features = false, features = [
    "alloc",
] }
sha2 = { version = "0.10", features = ["asm"] }
syn = { version = "2", features = ["full"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# git
bezel = { git = "https://github.com/crabtalk/bezel", rev = "f86dbbf" }
# Pinned at bezel's own gpui rev. A different one is a second type universe,
# whose failure is a window that paints shapes but no text.
gpui = { git = "https://github.com/crabtalk/zed", rev = "cf1b90ec8cfda974a50b0c9eaebfdab28d7f0423" }
gpui_platform = { git = "https://github.com/crabtalk/zed", rev = "cf1b90ec8cfda974a50b0c9eaebfdab28d7f0423", features = [
    "font-kit",
] }
