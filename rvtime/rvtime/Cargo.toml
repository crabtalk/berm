[package]
name = "rvtime"
description = "A RISC-V compiler with a wasmtime-like interface"
edition.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
readme = "../README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = ["aot"]

# Compile a guest into memory and run it from there.
jit = ["compiler/jit"]

# Compile a guest into an object file and run that. Enabling this selects it:
# features are additive, so a build with both still runs every guest ahead of
# time.
aot = ["compiler/aot", "dep:sha2"]

[dependencies]
anyhow.workspace = true
compiler.workspace = true
libc.workspace = true
rv.workspace = true
sha2 = { workspace = true, optional = true }
translator.workspace = true
tracing.workspace = true

[dev-dependencies]
libc.workspace = true
rv.workspace = true
